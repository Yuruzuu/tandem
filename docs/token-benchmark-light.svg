<svg xmlns="http://www.w3.org/2000/svg" width="620" height="254" viewBox="0 0 620 254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Input tokens per request: Opus behind Codex about 227k, all full price; Tandem 24.7k, and 24.7k read from cache on a repeat request.</title>
<text x="0" y="22" font-size="16" font-weight="600" fill="#0b0b0b">Input tokens per request</text>
<text x="0" y="44" font-size="12.5" fill="#52514e">Same one-word prompt through Codex. Cached tokens cost far less.</text>
