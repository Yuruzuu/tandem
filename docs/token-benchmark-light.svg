<text x="168.0" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">0</text>
<line x1="228.4" y1="94" x2="228.4" y2="224" stroke="#e4e3de" stroke-width="1"/>
<text x="228.4" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">50k</text>
<line x1="288.8" y1="94" x2="288.8" y2="224" stroke="#e4e3de" stroke-width="1"/>
<text x="288.8" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">100k</text>
<line x1="349.2" y1="94" x2="349.2" y2="224" stroke="#e4e3de" stroke-width="1"/>
<text x="349.2" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">150k</text>
<line x1="409.6" y1="94" x2="409.6" y2="224" stroke="#e4e3de" stroke-width="1"/>
<text x="409.6" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">200k</text>
<line x1="470.0" y1="94" x2="470.0" y2="224" stroke="#e4e3de" stroke-width="1"/>
<text x="470.0" y="240" font-size="11.5" text-anchor="middle" fill="#6e6d68">250k</text>
<text x="0" y="110" font-size="13.5" font-weight="600" fill="#0b0b0b">Opus behind Codex</text>
<text x="0" y="126" font-size="11.5" fill="#52514e">first version, average of 2 runs</text>
<path d="M168.0 100 h269.8 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-269.8 z" fill="#2a78d6"/>
