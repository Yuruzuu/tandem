<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Input tokens per request: Opus behind Codex about 227k, all full price; Tandem 24.7k, and 24.7k read from cache on a repeat request.</title>
<text x="20" y="30" font-size="17" font-weight="600" fill="#ffffff">Input tokens per request</text>
<text x="20" y="52" font-size="12.5" fill="#c3c2b7">Same one-word prompt through Codex. Fewer is better; cached tokens are much cheaper.</text>
<rect x="20" y="70" width="11" height="11" rx="2" fill="#3987e5"/>
<text x="37" y="80" font-size="12.5" fill="#c3c2b7">Full-price input</text>
<rect x="171" y="70" width="11" height="11" rx="2" fill="#d95926"/>
<text x="188" y="80" font-size="12.5" fill="#c3c2b7">Read from prompt cache</text>
<line x1="250.0" y1="98" x2="250.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="250.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">0</text>
<line x1="328.0" y1="98" x2="328.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="328.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">50k</text>
<line x1="406.0" y1="98" x2="406.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="406.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">100k</text>
<line x1="484.0" y1="98" x2="484.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="484.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">150k</text>
<line x1="562.0" y1="98" x2="562.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="562.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">200k</text>
<line x1="640.0" y1="98" x2="640.0" y2="228" stroke="#30363d" stroke-width="1"/>
<text x="640.0" y="246" font-size="11.5" text-anchor="middle" fill="#9a998f">250k</text>
<text x="20" y="114" font-size="13.5" font-weight="600" fill="#ffffff">Opus behind Codex</text>
<text x="20" y="130" font-size="11.5" fill="#c3c2b7">first version, average of 2 runs</text>
<path d="M250.0 104 h349.6 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-349.6 z" fill="#3987e5"/>
<text x="611.6" y="119" font-size="12.5" fill="#ffffff"><tspan font-weight="600">≈227k</tspan><tspan fill="#c3c2b7"> · 0 cached</tspan></text>
<text x="20" y="158" font-size="13.5" font-weight="600" fill="#ffffff">Tandem</text>
<text x="20" y="174" font-size="11.5" fill="#c3c2b7">first request</text>
<rect x="250.0" y="148" width="25.4" height="22" fill="#3987e5"/>
<path d="M277.4 148 h9.2 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-9.2 z" fill="#d95926"/>
<text x="298.6" y="163" font-size="12.5" fill="#ffffff"><tspan font-weight="600">24.7k</tspan><tspan fill="#c3c2b7"> · 8.5k cached</tspan></text>
<text x="20" y="202" font-size="13.5" font-weight="600" fill="#ffffff">Tandem</text>
<text x="20" y="218" font-size="11.5" fill="#c3c2b7">repeat request</text>
<rect x="250.0" y="192" width="0.0" height="22" fill="#3987e5"/>
<path d="M250.0 192 h34.6 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-34.6 z" fill="#d95926"/>
<text x="296.6" y="207" font-size="12.5" fill="#ffffff"><tspan font-weight="600">24.7k</tspan><tspan fill="#c3c2b7"> · all cached</tspan></text>
</svg>